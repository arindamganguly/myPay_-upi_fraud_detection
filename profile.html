<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | myPay</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #00f2fe;
            --accent: #4facfe;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            /* Theme Defaults */
            --body-bg: radial-gradient(circle at top right, #1e1b4b, #0f0c29);
            --text-color: #ffffff;
            --card-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        /* EXACT Light Mode Refinement */
        [data-theme="light"] {
            --body-bg: radial-gradient(circle at top right, #e0e7ff, #f8fafc);
            --text-color: #1e293b;
            --glass: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.05);
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--body-bg);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .profile-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: var(--card-shadow);
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* QR Container Styling */
        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 24px;
            display: inline-block;
            margin: 20px 0 10px 0;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            position: relative; 
            z-index: 1; 
        }

        #shareableQrContent {
            background: white; 
            padding: 25px; 
            border-radius: 24px;
            text-align: center;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .upi-id-tag {
            background: rgba(0, 242, 254, 0.1);
            color: #0f0c29; 
            padding: 8px 16px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: 15px; 
        }

        .btn-action {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            border: none;
            color: #000 !important;
            font-weight: 700;
            border-radius: 14px;
            padding: 12px 20px;
            transition: 0.3s;
            margin-bottom: 10px;
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3); text-decoration: none; }

        .btn-back {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            border-radius: 14px;
            padding: 10px 20px;
            transition: 0.3s;
        }
        .btn-back:hover { background: rgba(128,128,128,0.1); color: var(--text-color); text-decoration: none; }

        /* Floating Theme Toggle for Consistency */
        .theme-switch {
            position: fixed; top: 20px; right: 20px; width: 45px; height: 45px;
            border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-color);
        }
    </style>
</head>
<body>

<div class="theme-switch" onclick="toggleTheme()" id="themeIcon">🌙</div>

<div class="profile-card">
    <h4 class="font-weight-bold mb-1">My UPI QR</h4>
    <p class="small opacity-50 mb-4">Scan to pay me securely</p>

    <div id="shareableQrContent">
        <div id="qrcode"></div>
        <div class="upi-id-tag" id="displayUpiForImage"></div>
    </div>

    <div class="text-left mt-4 mb-4 opacity-75 small">
        <div class="d-flex justify-content-between mb-2">
            <span>Email</span>
            <span id="displayEmail" style="color: var(--text-color); font-weight: 600;">...</span>
        </div>
        <div class="d-flex justify-content-between">
            <span>UPI ID</span>
            <span id="displayUpiText" style="color: var(--text-color); font-weight: 600;">...</span>
        </div>
        <div class="d-flex justify-content-between">
            <span>Status</span>
            <span class="text-success font-weight-bold">Verified</span>
        </div>
    </div>

    <hr style="border-color: var(--glass-border)">
    
    <button class="btn btn-action btn-block mt-3" onclick="shareQr()">Share My QR</button>
    <a href="dashboard.html" class="btn btn-back btn-block mt-3">Back to Dashboard</a>
</div>

<script>
    // Theme Engine Logic
    function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById("themeIcon");
        if(body.getAttribute("data-theme") === "light") {
            body.removeAttribute("data-theme");
            icon.innerText = "🌙";
            localStorage.setItem("theme", "dark");
        } else {
            body.setAttribute("data-theme", "light");
            icon.innerText = "☀️";
            localStorage.setItem("theme", "light");
        }
    }

    // Auto load theme
    if(localStorage.getItem("theme") === "light") {
        document.body.setAttribute("data-theme", "light");
        document.getElementById("themeIcon").innerText = "☀️";
    }

    document.addEventListener("DOMContentLoaded", () => {
        const email = localStorage.getItem("mypay_email") || "user@mail.com";
        const upi = localStorage.getItem("mypay_upi") || "user@mypay";

        document.getElementById("displayEmail").innerText = email;
        document.getElementById("displayUpiText").innerText = upi;
        document.getElementById("displayUpiForImage").innerText = upi;

        const qrContent = `upi://pay?pa=${upi}&pn=${email.split('@')[0]}`;
        
        new QRCode(document.getElementById("qrcode"), {
            text: qrContent,
            width: 180,
            height: 180,
            colorDark : "#0f0c29",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    });

    async function shareQr() {
        const elementToCapture = document.getElementById('shareableQrContent');
        try {
            const canvas = await html2canvas(elementToCapture, {
                backgroundColor: '#ffffff',
                scale: 2
            });

            canvas.toBlob(async (blob) => {
                const file = new File([blob], "myPay_QR.png", { type: "image/png" });
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'My myPay UPI QR Code',
                            text: 'Scan my QR to pay me instantly on myPay!',
                            files: [file]
                        });
                    } catch (error) {
                        console.error('Error sharing:', error);
                    }
                } else {
                    const imgUrl = canvas.toDataURL("image/png");
                    const link = document.createElement('a');
                    link.href = imgUrl;
                    link.download = 'myPay_QR.png';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    alert('QR Downloaded successfully.');
                }
            }, 'image/png');
        } catch (error) {
            console.error('Capture failed:', error);
        }
    }
</script>

</body>
</html>
