<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myPay | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        :root {
            --primary: #00f2fe; --accent: #4facfe; --bg-dark: #0f0c29;
            --glass: rgba(255, 255, 255, 0.06); --glass-border: rgba(255, 255, 255, 0.12);
            --success: #4ade80; --danger: #f87171; --warning: #ffcc00;
            --body-bg: radial-gradient(circle at top right, #1e1b4b, #0f0c29);
            --text-main: white;
        }

        [data-theme="light"] {
            --body-bg: radial-gradient(circle at top right, #e0e7ff, #f8fafc);
            --text-main: #1e293b;
            --glass: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.08);
            --bg-dark: #ffffff;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--body-bg); color: var(--text-main); min-height: 100vh; overflow-x: hidden; transition: 0.3s; }
        
        .card-glass { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 24px; transition: all 0.3s ease; color: var(--text-main); }
        
        .navbar { background: rgba(15, 12, 41, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); z-index: 1050; }
        [data-theme="light"] .navbar { background: rgba(255, 255, 255, 0.8); }

        .balance-amount { font-size: 2.8rem; font-weight: 800; background: linear-gradient(to right, var(--text-main), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-main { background: linear-gradient(45deg, var(--primary), var(--accent)); border: none; color: #000 !important; font-weight: 700; border-radius: 14px; padding: 12px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3); }
        .btn-main:hover { transform: translateY(-2px); opacity: 0.9; text-decoration: none; }

        .live-scan-container { background: rgba(74, 222, 128, 0.05); border: 1px solid rgba(74, 222, 128, 0.3); padding: 10px 20px; border-radius: 100px; display: flex; align-items: center; cursor: pointer; }
        
        .radar-ring { width: 16px; height: 16px; border: 2px solid var(--success); border-radius: 50%; margin-right: 12px; animation: rotate-radar 1s linear infinite; }
        @keyframes rotate-radar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .transaction-item { background: rgba(128, 128, 128, 0.08); border-radius: 18px !important; margin-bottom: 12px; padding: 15px 20px; display: flex; align-items: center; border: 1px solid var(--glass-border); color: var(--text-main); }
        
        .icon-circle { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-weight: bold; }
        .bg-up { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
        .bg-down { background: rgba(74, 222, 128, 0.15); color: var(--success); }
        
        .theme-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); font-size: 1.2rem; margin-right: 15px; }

        /* Notification Popup Styles */
        #notifyPopup { 
            display: none; 
            position: fixed; 
            top: 100px; 
            right: 20px; 
            width: 320px; 
            background: rgba(15, 12, 41, 0.9); 
            backdrop-filter: blur(20px); 
            border: 2px solid var(--success); 
            border-radius: 20px; 
            padding: 20px; 
            z-index: 9999; 
            color: white; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            transform: translateX(400px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notifyPopup.show { display: block; transform: translateX(0); }
    </style>
</head>
<body>

<div id="notifyPopup">
    <div class="d-flex align-items-center mb-2">
        <div class="icon-circle bg-down mr-2" style="width:30px; height:30px;">↓</div>
        <h6 class="mb-0 font-weight-bold">Payment Received!</h6>
    </div>
    <p class="small mb-0" id="notifyText">You received a payment.</p>
</div>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand font-weight-bold" href="#" style="color: var(--text-main);">myPay<span style="color:var(--primary)">.</span></a>
        <div class="ml-auto d-flex align-items-center">
            <div class="theme-btn" onclick="toggleTheme()" id="themeIcon">🌙</div>
            <span id="userEmail" class="mr-3 d-none d-md-inline small opacity-75"></span>
            <button class="btn btn-sm btn-outline-light rounded-pill px-3 mr-2" style="color: var(--text-main); border-color: var(--glass-border);" onclick="location.href='profile.html'">Profile</button>
            <button class="btn btn-sm btn-danger rounded-pill px-3" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container" style="padding-top: 110px; padding-bottom: 60px;">
    <div class="row">
        <div class="col-lg-7 mb-4">
            <div class="card card-glass p-4 h-100">
                <p class="small opacity-50 mb-0">CURRENT WALLET BALANCE</p>
                <div class="balance-amount mb-3" id="mainBalance">₹0.00</div>
                <div class="d-flex align-items-center">
                    <span class="badge badge-pill badge-success mr-2" style="font-size: 0.6rem; padding: 5px 10px;">● WALLET ACTIVE</span>
                    <small class="opacity-50">UPI ID: <span id="upiDisp">loading...</span></small>
                </div>
            </div>
        </div>
        <div class="col-lg-5 mb-4">
            <div class="card card-glass p-4 h-100">
                <h6 class="mb-4">Quick Actions</h6>
                <div class="row no-gutters">
                    <div class="col-6 pr-2"><button class="btn btn-main btn-block" onclick="location.href='add-money.html'">Add Money</button></div>
                    <div class="col-6 pl-2"><button class="btn btn-main btn-block" onclick="location.href='send-money.html'">Send Money</button></div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-12">
            <div class="card card-glass p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div><h6 class="mb-1 font-weight-bold">UPI Fraud Detection</h6><p class="small opacity-50 mb-0">Monitoring Live</p></div>
                    <div class="live-scan-container" onclick="location.href='ai-terminal.html'">
                        <div class="radar-ring"></div>
                        <span class="small font-weight-bold text-success">SCAN HERE</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card card-glass p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h6 class="mb-0 font-weight-bold">Recent Transactions</h6>
                </div>
                <div id="transactionList">
                    <div class="text-center opacity-30 py-4" id="emptyMsg">No recent activity</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, collection, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBac3YoqKFOS-gdsRylLdOfcqjLjKE5nN0",
        authDomain: "mypay-429c8.firebaseapp.com",
        projectId: "mypay-429c8",
        storageBucket: "mypay-429c8.firebasestorage.app",
        messagingSenderId: "1056662437664",
        appId: "1:1056662437664:web:20bff46ea25a660186e145"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Theme Logic
    window.toggleTheme = () => {
        const body = document.body;
        const icon = document.getElementById("themeIcon");
        if(body.getAttribute("data-theme") === "light") {
            body.removeAttribute("data-theme");
            icon.innerText = "🌙";
            localStorage.setItem("theme", "dark");
        } else {
            body.setAttribute("data-theme", "light");
            icon.innerText = "☀️";
            localStorage.setItem("theme", "light");
        }
    };

    if(localStorage.getItem("theme") === "light") {
        document.body.setAttribute("data-theme", "light");
        document.getElementById("themeIcon").innerText = "☀️";
    }

    const myUpiID = localStorage.getItem("mypay_upi");
    if(!myUpiID) window.location.href = 'index.html';

    document.getElementById("userEmail").innerText = localStorage.getItem("mypay_email");
    document.getElementById("upiDisp").innerText = myUpiID;

    // --- REAL-TIME LISTENER FOR BALANCE & POPUPS ---
    const userRef = doc(db, "users", myUpiID);
    onSnapshot(userRef, (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.data();
            
            // Update Balance
            document.getElementById("mainBalance").innerText = "₹" + (data.balance || 0).toLocaleString('en-IN', {minimumFractionDigits: 2});
            
            // Trigger Popup only if showPopup is true
            if (data.showPopup === true) {
                triggerPopup(data.lastAmount, data.lastSender);
                
                // Immediately reset the trigger in Firestore
                updateDoc(userRef, { showPopup: false });
            }
        }
    });

    // --- REAL-TIME TRANSACTION LISTENER ---
    const q = query(
        collection(db, "transactions"), 
        where("participants", "array-contains", myUpiID), 
        orderBy("timestamp", "desc"), 
        limit(8)
    );

    onSnapshot(q, (snapshot) => {
        const list = document.getElementById("transactionList");
        if (!snapshot.empty) {
            list.innerHTML = ""; 
            snapshot.forEach((doc) => {
                const txn = doc.data();
                if (txn.sender) { 
                    const isDebit = txn.sender === myUpiID;
                    const title = isDebit ? `To: ${txn.receiver}` : `From: ${txn.sender}`;
                    addTxnToUI(title, txn.amount, isDebit ? 'up' : 'down');
                }
            });
        } else {
            list.innerHTML = '<div class="text-center opacity-30 py-4">No recent activity</div>';
        }
    }, (error) => {
        console.error("Index required or Permission Error:", error);
    });

    function addTxnToUI(title, amount, type) {
        const list = document.getElementById("transactionList");
        const item = document.createElement("div");
        item.className = "transaction-item";
        const isDebit = type === 'up';
        
        item.innerHTML = `
            <div class="icon-circle ${isDebit ? 'bg-up' : 'bg-down'}">${isDebit ? '↑' : '↓'}</div>
            <div class="flex-grow-1">
                <h6 class="mb-0 font-weight-bold" style="font-size:0.9rem;">${title}</h6>
                <small class="opacity-50">Completed</small>
            </div>
            <div class="text-right">
                <div class="font-weight-bold ${isDebit ? 'text-danger' : 'text-success'}" style="font-size:1rem;">
                    ${isDebit ? '-' : '+'}₹${parseFloat(amount).toLocaleString('en-IN', {minimumFractionDigits: 2})}
                </div>
            </div>
        `;
        list.appendChild(item);
    }

    // --- IMPROVED DYNAMIC POPUP FUNCTION ---
    function triggerPopup(amt, sender) {
        const popup = document.getElementById("notifyPopup");
        const notifyText = document.getElementById("notifyText");
        
        notifyText.innerText = `Received ₹${parseFloat(amt).toLocaleString('en-IN')} from ${sender}`;
        
        // Show the popup
        popup.classList.add("show");
        popup.style.display = "block";

        // Auto-hide after 5 seconds
        setTimeout(() => {
            popup.classList.remove("show");
            setTimeout(() => { popup.style.display = "none"; }, 500);
        }, 5000);
    }

    window.logout = () => { localStorage.clear(); window.location.href = "index.html"; };
</script>
</body>
</html>
