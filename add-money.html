<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Money | myPay</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #00f2fe;
            --glass: rgba(255, 255, 255, 0.08);
            --success: #4ade80;
            --danger: #f87171;
            /* Theme Variables */
            --body-bg: radial-gradient(circle at top right, #1e1b4b, #0f0c29);
            --text-color: #ffffff;
            --input-bg: rgba(255, 255, 255, 0.05);
            --card-shadow: 0 25px 50px rgba(0,0,0,0.5);
            --glass-border: rgba(255,255,255,0.15);
        }

        /* Light Mode Styling - Layout stays identical */
        [data-theme="light"] {
            --body-bg: radial-gradient(circle at top right, #e0e7ff, #f8fafc);
            --text-color: #1e293b;
            --glass: rgba(255, 255, 255, 0.8);
            --input-bg: #f1f5f9;
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --glass-border: rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--body-bg);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: background 0.3s ease;
        }

        .payment-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: var(--card-shadow);
            transition: background 0.3s ease, color 0.3s ease;
        }

        #qrcode {
            background: white;
            padding: 15px;
            border-radius: 20px;
            display: inline-block;
            margin: 20px 0;
            border: 5px solid var(--primary);
            position: relative;
        }

        .amount-input {
            background: var(--input-bg);
            border: 1px solid var(--primary);
            color: var(--text-color);
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            border-radius: 18px;
            height: 80px;
        }
        .amount-input:focus {
            background: var(--input-bg);
            color: var(--text-color);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .timer-box {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--danger);
            background: rgba(248, 113, 113, 0.1);
            padding: 8px 15px;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-pay {
            background: linear-gradient(45deg, var(--primary), #4facfe);
            border: none; color: #000 !important; font-weight: 800;
            border-radius: 16px; padding: 18px;
            transition: 0.3s;
        }
        .btn-pay:hover { transform: scale(1.02); opacity: 0.9; }

        .btn-link-custom { color: var(--text-color); opacity: 0.6; font-size: 0.85rem; text-decoration: none; }
        .btn-link-custom:hover { opacity: 1; color: var(--primary); }
        
        #expired-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }

        /* Floating Theme Switcher for testing/consistency */
        .theme-switch {
            position: fixed; top: 20px; right: 20px;
            width: 45px; height: 45px; border-radius: 50%;
            background: var(--glass); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-color);
        }
    </style>
</head>
<body>

<div class="theme-switch" onclick="toggleTheme()" id="themeIcon">🌙</div>

<div class="payment-card">
    <div id="step-1">
        <h3 class="font-weight-bold mb-2">Add Money</h3>
        <p class="small opacity-50 mb-4">Instant deposit to your myPay Wallet</p>
        
        <label class="small font-weight-bold d-block mb-2">AMOUNT (₹)</label>
        <input type="number" id="amount" class="form-control amount-input mb-4" placeholder="0" autofocus>
        
        <button class="btn btn-pay btn-block" onclick="generateQR()">
            ADD TO ACCOUNT
        </button>
        <div class="mt-3">
            <a href="dashboard.html" class="btn-link-custom">Back to Home</a>
        </div>
    </div>

    <div id="step-2" style="display: none;">
        <div class="timer-box">
            <span class="mr-2">⏳ Session Expires in:</span>
            <span id="timer">05:00</span>
        </div>

        <div style="position: relative; display: inline-block;">
            <div id="qrcode"></div>
            <div id="expired-overlay">
                <h5 class="mb-0">QR Expired</h5>
            </div>
        </div>

        <h2 class="font-weight-bold mb-1" id="displayAmount"></h2>
        <p class="small font-weight-bold mb-4" style="color: var(--primary)">
            UPI ID: <span id="targetUpi" style="color: var(--text-color)"></span>
        </p>
        
        <button id="completeBtn" class="btn btn-success btn-block py-3 font-weight-bold mb-2" style="border-radius:16px" onclick="completePayment()">
            I HAVE PAID
        </button>
        <button class="btn btn-outline-secondary btn-block btn-sm" onclick="location.reload()" style="border-radius:12px; opacity:0.6; color: var(--text-color)">Cancel & Reset</button>
    </div>
</div>

<script>
    // Theme Engine
    function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById("themeIcon");
        if(body.getAttribute("data-theme") === "light") {
            body.removeAttribute("data-theme");
            icon.innerText = "🌙";
            localStorage.setItem("theme", "dark");
        } else {
            body.setAttribute("data-theme", "light");
            icon.innerText = "☀️";
            localStorage.setItem("theme", "light");
        }
    }

    // Auto load theme
    if(localStorage.getItem("theme") === "light") {
        document.body.setAttribute("data-theme", "light");
        document.getElementById("themeIcon").innerText = "☀️";
    }

    let currentAmount = 0;
    let timerInterval;

    function startTimer(durationSeconds) {
        let timer = durationSeconds;
        const display = document.getElementById('timer');
        
        timerInterval = setInterval(() => {
            let minutes = parseInt(timer / 60, 10);
            let seconds = parseInt(timer % 60, 10);
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            display.textContent = minutes + ":" + seconds;

            if (--timer < 0) {
                clearInterval(timerInterval);
                handleExpiry();
            }
        }, 1000);
    }

    function handleExpiry() {
        document.getElementById('expired-overlay').style.display = 'flex';
        document.getElementById('completeBtn').disabled = true;
        document.getElementById('completeBtn').innerText = "SESSION EXPIRED";
        document.getElementById('completeBtn').classList.replace('btn-success', 'btn-secondary');
    }

    function generateQR() {
        const amtVal = document.getElementById('amount').value;
        if (!amtVal || amtVal <= 0) return alert("Enter a valid amount");

        currentAmount = parseFloat(amtVal);
        const myUpiId = localStorage.getItem("mypay_upi") || "user@mypay";
        const myName = "myPay Wallet Topup";

        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'block';
        document.getElementById('displayAmount').innerText = "₹" + currentAmount.toLocaleString('en-IN');
        document.getElementById('targetUpi').innerText = myUpiId;

        const upiLink = `upi://pay?pa=${myUpiId}&pn=${encodeURIComponent(myName)}&am=${currentAmount}&cu=INR`;

        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: upiLink,
            width: 220,
            height: 220,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        startTimer(300);
    }

    function completePayment() {
        let balance = parseFloat(localStorage.getItem("mypay_balance")) || 0;
        balance += currentAmount;
        localStorage.setItem("mypay_balance", balance);
        
        alert("Transaction successful! Balance updated.");
        window.location.href = "dashboard.html";
    }
</script>

</body>
</html>
