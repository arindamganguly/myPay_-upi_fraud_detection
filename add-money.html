<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Money | myPay</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #00f2fe; --glass: rgba(255, 255, 255, 0.08);
            --success: #4ade80; --danger: #f87171;
            --body-bg: radial-gradient(circle at top right, #1e1b4b, #0f0c29);
            --text-color: #ffffff; --input-bg: rgba(255, 255, 255, 0.05);
            --card-shadow: 0 25px 50px rgba(0,0,0,0.5); --glass-border: rgba(255,255,255,0.15);
        }

        [data-theme="light"] {
            --body-bg: radial-gradient(circle at top right, #e0e7ff, #f8fafc);
            --text-color: #1e293b; --glass: rgba(255, 255, 255, 0.8);
            --input-bg: #f1f5f9; --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --glass-border: rgba(0, 0, 0, 0.05);
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--body-bg); color: var(--text-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; transition: 0.3s; }

        .payment-card { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 32px; padding: 40px 30px; width: 100%; max-width: 420px; text-align: center; box-shadow: var(--card-shadow); }

        #qrcode { background: white; padding: 15px; border-radius: 20px; display: inline-block; margin: 20px 0; border: 5px solid var(--primary); position: relative; }

        .amount-input { background: var(--input-bg); border: 1px solid var(--primary); color: var(--text-color); font-size: 2.2rem; font-weight: 800; text-align: center; border-radius: 18px; height: 80px; }
        
        .timer-box { font-size: 0.9rem; font-weight: 700; color: var(--danger); background: rgba(248, 113, 113, 0.1); padding: 8px 15px; border-radius: 100px; display: inline-flex; align-items: center; margin-bottom: 15px; }

        .btn-pay { background: linear-gradient(45deg, var(--primary), #4facfe); border: none; color: #000 !important; font-weight: 800; border-radius: 16px; padding: 18px; transition: 0.3s; width: 100%; }
        
        #expired-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); border-radius: 15px; color: white; justify-content: center; align-items: center; flex-direction: column; z-index: 10; }

        .theme-switch { position: fixed; top: 20px; right: 20px; width: 45px; height: 45px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-color); }
    </style>
</head>
<body>

<div class="theme-switch" onclick="toggleTheme()" id="themeIcon">🌙</div>

<div class="payment-card">
    <div id="step-1">
        <h3 class="font-weight-bold mb-2">Add Money</h3>
        <p class="small opacity-50 mb-4">Instant deposit to your myPay Wallet</p>
        
        <label class="small font-weight-bold d-block mb-2">AMOUNT (₹)</label>
        <input type="number" id="amount" class="form-control amount-input mb-4" placeholder="0" autofocus>
        
        <button class="btn btn-pay" onclick="generateQR()">ADD TO ACCOUNT</button>
        <div class="mt-3"><a href="dashboard.html" class="small opacity-50 text-white" style="text-decoration:none">Back to Home</a></div>
    </div>

    <div id="step-2" style="display: none;">
        <div class="timer-box">⏳ Session Expires in: <span id="timer" class="ml-1">05:00</span></div>
        <div style="position: relative; display: inline-block;">
            <div id="qrcode"></div>
            <div id="expired-overlay"><h5>QR Expired</h5></div>
        </div>
        <h2 class="font-weight-bold mb-1" id="displayAmount"></h2>
        <p class="small font-weight-bold mb-4" style="color: var(--primary)">UPI ID: <span id="targetUpi" style="color: var(--text-color)"></span></p>
        <button id="completeBtn" class="btn btn-success btn-block py-3 font-weight-bold mb-2" style="border-radius:16px" onclick="completePayment()">I HAVE PAID</button>
        <button class="btn btn-link btn-block btn-sm text-white opacity-50" onclick="location.reload()">Cancel</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, updateDoc, increment, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBac3YoqKFOS-gdsRylLdOfcqjLjKE5nN0",
        authDomain: "mypay-429c8.firebaseapp.com",
        projectId: "mypay-429c8",
        storageBucket: "mypay-429c8.firebasestorage.app",
        messagingSenderId: "1056662437664",
        appId: "1:1056662437664:web:20bff46ea25a660186e145"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const myUpiID = localStorage.getItem("mypay_upi");

    let currentAmount = 0;
    let timerInterval;

    // Theme Engine
    window.toggleTheme = () => {
        const body = document.body;
        const icon = document.getElementById("themeIcon");
        if(body.getAttribute("data-theme") === "light") {
            body.removeAttribute("data-theme");
            icon.innerText = "🌙";
            localStorage.setItem("theme", "dark");
        } else {
            body.setAttribute("data-theme", "light");
            icon.innerText = "☀️";
            localStorage.setItem("theme", "light");
        }
    };

    if(localStorage.getItem("theme") === "light") {
        document.body.setAttribute("data-theme", "light");
        document.getElementById("themeIcon").innerText = "☀️";
    }

    window.generateQR = () => {
        const amtVal = document.getElementById('amount').value;
        if (!amtVal || amtVal <= 0) return alert("Enter a valid amount");

        currentAmount = parseFloat(amtVal);
        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'block';
        document.getElementById('displayAmount').innerText = "₹" + currentAmount.toLocaleString('en-IN');
        document.getElementById('targetUpi').innerText = myUpiID;

        const upiLink = `upi://pay?pa=${myUpiID}&pn=myPayWallet&am=${currentAmount}&cu=INR`;
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: upiLink, width: 220, height: 220,
            colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
        });

        startTimer(300);
    };

    function startTimer(duration) {
        let timer = duration;
        timerInterval = setInterval(() => {
            let mins = Math.floor(timer / 60);
            let secs = timer % 60;
            document.getElementById('timer').textContent = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (--timer < 0) {
                clearInterval(timerInterval);
                document.getElementById('expired-overlay').style.display = 'flex';
                document.getElementById('completeBtn').disabled = true;
            }
        }, 1000);
    }

    window.completePayment = async () => {
        const btn = document.getElementById('completeBtn');
        btn.disabled = true;
        btn.innerText = "Processing...";

        try {
            const userRef = doc(db, "users", myUpiID);
            
            // 1. Update Actual Database Balance
            await updateDoc(userRef, {
                balance: increment(currentAmount)
            });

            // 2. Add to Transaction History
            await addDoc(collection(db, "transactions"), {
                sender: "Self / Bank",
                receiver: myUpiID,
                amount: currentAmount,
                timestamp: serverTimestamp(),
                status: "SUCCESS",
                participants: [myUpiID]
            });

            alert("₹" + currentAmount + " added to your wallet!");
            window.location.href = "dashboard.html";
        } catch (e) {
            alert("Database error. Please try again.");
            btn.disabled = false;
            btn.innerText = "I HAVE PAID";
        }
    };
</script>

</body>
</html>
