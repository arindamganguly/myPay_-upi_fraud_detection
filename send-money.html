<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myPay Shield | Universal UPI Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { 
            --primary: #00f2fe; --accent: #4facfe; --success: #4ade80; --danger: #f87171;
            --body-bg: radial-gradient(circle at top right, #1e1b4b, #0f0c29);
            --text-color: #ffffff; --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12); --input-bg: rgba(255, 255, 255, 0.05);
            --shield-bg: rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] {
            --body-bg: radial-gradient(circle at top right, #e0e7ff, #f8fafc);
            --text-color: #1e293b; --glass: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.05); --input-bg: #f1f5f9;
            --shield-bg: rgba(0, 242, 254, 0.05);
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--body-bg); color: var(--text-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; transition: background 0.3s ease; }
        .send-card { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 28px; padding: 30px; width: 100%; max-width: 420px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        
        /* Call Shield Overlay */
        #hardwareBlock {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 41, 0.98); z-index: 5000; border-radius: 28px;
            flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px;
        }

        .fraud-border { border: 2px solid var(--danger) !important; animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(248, 113, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0); } }
        
        .captcha-row { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--glass-border); display: none; }
        .shake { animation: shake 0.4s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        #qr-reader-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        #qr-reader { width: 280px; border: 2px solid var(--primary) !important; border-radius: 20px; overflow: hidden; }
        
        .form-control { background: var(--input-bg); border: 1px solid var(--glass-border); color: var(--text-color); border-radius: 14px; padding: 25px; font-weight: 600; }
        .form-control:focus { background: var(--input-bg); color: var(--text-color); border-color: var(--primary); outline: none; box-shadow: none; }
        
        .risk-shield-panel { background: var(--shield-bg); border: 1px dashed var(--primary); border-radius: 20px; padding: 20px; display: none; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-glow { background: linear-gradient(45deg, var(--primary), var(--accent)); border: none; color: #000 !important; font-weight: 800; border-radius: 14px; padding: 15px; transition: 0.3s; width: 100%; }
        .security-badge { font-size: 11px; padding: 4px 10px; border-radius: 6px; background: rgba(0, 242, 254, 0.1); border: 1px solid var(--primary); color: var(--primary); margin-bottom: 10px; display: inline-block; }
        .badge-danger { background: rgba(248, 113, 113, 0.1); border-color: var(--danger); color: var(--danger); }
        
        .theme-toggle { position: fixed; top: 20px; right: 20px; width: 45px; height: 45px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-color); z-index: 100; }
    </style>
</head>
<body>

<div class="theme-toggle" onclick="toggleTheme()" id="themeIcon">🌙</div>

<div id="qr-reader-container">
    <div id="qr-reader" class="mb-4"></div>
    <button class="btn btn-outline-light rounded-pill px-4" onclick="stopScanner()">Cancel Scan</button>
</div>

<div class="send-card" id="mainCard">
    <div id="hardwareBlock">
        <h3 class="text-danger font-weight-bold">🛡️ CALL SHIELD BLOCKED</h3>
        <p class="small mt-3">Active call detected. Scam Prevention active. <br><b>Hand-off to UPI disabled.</b></p>
        <button class="btn btn-outline-primary btn-sm mt-3" onclick="location.reload()">Retry</button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="font-weight-bold mb-0">myPay Shield</h5>
        <div id="balView" class="small font-weight-bold text-primary">₹500.00</div>
    </div>

    <div id="step1">
        <div class="form-group">
            <div class="d-flex justify-content-between mb-2">
                <label class="small opacity-50 font-weight-bold">RECEIVER UPI</label>
                <a href="javascript:void(0)" class="small text-primary font-weight-bold" onclick="startScanner()">SCAN QR</a>
            </div>
            <input type="text" id="targetUpi" class="form-control" placeholder="username@mypay">
        </div>
        <div class="form-group">
            <label class="small opacity-50 font-weight-bold">AMOUNT</label>
            <input type="number" id="targetAmount" class="form-control" placeholder="0.00">
        </div>
        <button class="btn btn-glow mt-4" id="verifyBtn">Verify Security</button>
        <button class="btn btn-link btn-block text-danger mt-2 small" onclick="reportAsScam()">Report this UPI as Scam</button>
        <button class="btn btn-link btn-block mt-1 small" style="color: var(--text-color); opacity: 0.5" onclick="location.href='dashboard.html'">Back to Dashboard</button>
    </div>

    <div id="step2" class="risk-shield-panel">
        <div id="riskTitle" class="small text-primary font-weight-bold mb-3">PROTECTED SESSION</div>
        <div id="securityStats"></div>
        
        <div id="captchaRow" class="captcha-row">
            <div class="d-flex justify-content-between align-items-center">
                <span class="small font-weight-bold">Identity Math:</span>
                <span id="mathEq" class="text-primary font-weight-bold mx-2"></span>
                <input type="number" id="captchaAns" class="form-control" style="width: 80px; padding: 10px; height: 40px; display: inline-block;" placeholder="?">
            </div>
        </div>

        <div class="d-flex justify-content-between small mb-2"><span>Call State Detection</span><span id="voiceStatus" class="text-success">Safe</span></div>
        <div class="d-flex justify-content-between small mb-3"><span>Community Shield</span><span id="patternStatus" class="text-success">Verified</span></div>
        
        <div id="actionBtnArea">
            <button class="btn btn-success btn-block font-weight-bold py-3" id="confirmBtn" style="border-radius: 14px">Confirm & Pay via UPI</button>
        </div>
        <button class="btn btn-link btn-block text-danger mt-2 small" onclick="location.reload()">Cancel</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBac3YoqKFOS-gdsRylLdOfcqjLjKE5nN0", 
        authDomain: "mypay-429c8.firebaseapp.com", 
        projectId: "mypay-429c8", 
        storageBucket: "mypay-429c8.firebasestorage.app", 
        messagingSenderId: "1056662437664", 
        appId: "1:1056662437664:web:20bff46ea25a660186e145" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let captchaResult = 0;

    // Call Detection (Mic hardware check)
    async function checkCallStatus() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(track => track.stop());
            return false;
        } catch (err) {
            return true; 
        }
    }

    // Community Report Logic
    window.reportAsScam = async () => {
        const upi = document.getElementById("targetUpi").value.trim().toLowerCase();
        if(!upi) return alert("Please enter a UPI ID first.");

        if(confirm(`Report ${upi} to the global blacklist?`)) {
            try {
                const scamRef = doc(db, "blacklist", upi);
                await setDoc(scamRef, { 
                    reports: increment(1), 
                    status: "flagged",
                    last_report: new Date() 
                }, { merge: true });
                alert("🛡️ Reported! This ID is now on the Global Watchlist.");
            } catch (e) { alert("Error: " + e.message); }
        }
    };

    window.verifySecurity = async () => {
        // Step 1: Detect Ongoing Call
        if(await checkCallStatus()) {
            document.getElementById("hardwareBlock").style.display = "flex";
            return;
        }

        const amt = parseFloat(document.getElementById("targetAmount").value);
        const targetUpi = document.getElementById("targetUpi").value.trim().toLowerCase();
        
        if(!targetUpi || !amt || amt <= 0) return alert("Enter valid UPI and amount.");

        try {
            // Step 2: Check Community Blacklist
            const blacklistSnap = await getDoc(doc(db, "blacklist", targetUpi));
            const reportCount = blacklistSnap.exists() ? (blacklistSnap.data().reports || 0) : 0;
            
            if(reportCount > 1 || targetUpi === "arnobdey@mypay") {
                document.getElementById("mainCard").classList.add("fraud-border");
                document.getElementById("riskTitle").innerText = "SUSPICIOUS NATURE DETECTED";
                document.getElementById("securityStats").innerHTML = `<div class="security-badge badge-danger">REPORTED BY ${reportCount} USERS</div>`;
                document.getElementById("actionBtnArea").innerHTML = `<button class="btn btn-danger btn-block py-3 font-weight-bold" onclick="alert('Transaction Blocked: Reported Scammer.')">BLOCK TRANSACTION</button>`;
            } else {
                document.getElementById("securityStats").innerHTML = `<div class="security-badge">Nature: Safe</div>`;
                document.getElementById("captchaRow").style.display = "block";
                runCaptcha();
            }
            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "block";
        } catch (e) { alert("Security failed: " + e.message); }
    };

    window.finalizeTransfer = () => {
        const ans = parseInt(document.getElementById("captchaAns").value);
        if(ans !== captchaResult) { runCaptcha(); return alert("Math verification failed."); }
        
        const upi = document.getElementById("targetUpi").value;
        const amt = document.getElementById("targetAmount").value;
        window.location.href = `upi://pay?pa=${upi}&am=${amt}&cu=INR&tn=myPay_Verified`;
    };

    function runCaptcha() {
        const n1 = Math.floor(Math.random() * 10) + 1;
        const n2 = Math.floor(Math.random() * 10) + 1;
        captchaResult = n1 + n2;
        document.getElementById("mathEq").innerText = `${n1} + ${n2} =`;
    }

    window.toggleTheme = () => {
        const b = document.body;
        if(b.getAttribute("data-theme") === "light") b.removeAttribute("data-theme");
        else b.setAttribute("data-theme", "light");
    };

    document.getElementById("verifyBtn").onclick = window.verifySecurity;
    document.getElementById("confirmBtn").onclick = window.finalizeTransfer;
</script>

<script>
    let scanner;
    async function startScanner() {
        document.getElementById("qr-reader-container").style.display = "flex";
        scanner = new Html5Qrcode("qr-reader");
        scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (res) => {
            const upi = res.includes("pa=") ? new URLSearchParams(res.split('?')[1]).get('pa') : res;
            document.getElementById("targetUpi").value = upi;
            stopScanner();
        });
    }
    function stopScanner() { if(scanner) scanner.stop().then(() => document.getElementById("qr-reader-container").style.display = "none"); }
</script>
</body>
</html>
